services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: convertly
      POSTGRES_USER: convertly
      POSTGRES_PASSWORD: convertly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: convertly
      MINIO_ROOT_PASSWORD: convertly-local-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9002:9001"
  app:
    build: .
    env_file:
      - .env.local
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://convertly:convertly@postgres:5432/convertly
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: convertly-files
      S3_ACCESS_KEY: convertly
      S3_SECRET_KEY: convertly-local-secret
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    depends_on:
      - postgres
      - minio
volumes:
  postgres_data:
  minio_data:
