services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: convertly
      POSTGRES_USER: convertly
      POSTGRES_PASSWORD: convertly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: convertly
      MINIO_ROOT_PASSWORD: convertly-local-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9002:9001"
volumes:
  postgres_data:
  minio_data:
